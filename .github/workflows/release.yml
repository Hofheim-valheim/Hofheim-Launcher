name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # .exe (instalador NSIS) + blockmap (update delta) + latest.yml (auto-updater)
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-22.04
            name: linux
            # AppImage (auto-updater funciona) + .deb (Debian/Ubuntu, sem auto-update).
            # Não há *.blockmap aqui: no AppImage o blockmap vai embutido no próprio arquivo.
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sincronizar versão com a tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # O `publish.owner`/`repo` do package.json é o que o electron-builder grava no
      # app-update.yml embutido no instalador — é dele que o auto-updater tira a URL do feed
      # PARA SEMPRE, em toda máquina que instalar esta versão. Um owner errado aqui não quebra
      # o build: quebra a atualização dos jogadores depois, com 404, e só se conserta
      # reinstalando na mão (foi o que aconteceu na v2.3.14, owner "HofheimBr"). Por isso o
      # release para aqui se o owner/repo não for o do próprio repositório que está publicando.
      - name: Conferir se o feed do auto-updater aponta para este repositório
        shell: bash
        run: |
          owner=$(node -p "require('./package.json').build.publish.owner")
          repo=$(node -p "require('./package.json').build.publish.repo")
          expected_owner="${GITHUB_REPOSITORY%%/*}"
          expected_repo="${GITHUB_REPOSITORY#*/}"
          if [ "$owner" != "$expected_owner" ] || [ "$repo" != "$expected_repo" ]; then
            echo "::error::package.json build.publish aponta para $owner/$repo, mas a release é de $expected_owner/$expected_repo. O auto-updater dos jogadores tomaria 404. Corrija o package.json e refaça a tag."
            exit 1
          fi
          echo "feed do auto-updater: $owner/$repo — ok"

      # Dois downloads distintos do mesmo binário (~90 MB), com caches separados:
      #   .cache/electron         → postinstall do pacote npm `electron` (@electron/get)
      #   .cache/electron-builder → app-builder, no empacotamento (ELECTRON_BUILDER_CACHE)
      # Com os dois quentes o download nem acontece — melhor defesa contra o "socket hang up"/EOF
      # que já derrubou a release. A key segue o package-lock: mudou o electron, baixa de novo.
      - name: Cache dos binários do Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-v2-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-v2-${{ matrix.os }}-

      # Retry explícito: o @electron/get NÃO retenta, então uma falha de rede transitória
      # (socket hang up no meio do zip) reprova o job todo. `npm ci` apaga node_modules antes,
      # então cada tentativa começa limpa. bash nas duas plataformas (no Windows vem o Git Bash).
      - name: Instalar dependências
        shell: bash
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::npm ci falhou (tentativa $i/3) — nova tentativa em $((i * 15))s"
              sleep $((i * 15))
            fi
          done
          echo "::error::npm ci falhou nas 3 tentativas"
          exit 1

      # Mesmo problema do npm ci, um passo adiante: o app-builder baixa o zip do electron aqui e
      # também não retenta sozinho (falha com EOF no meio do download e reprova o job). Retry
      # explícito; se o download já tiver ido, a tentativa seguinte pega do cache e é rápida.
      - name: Build
        shell: bash
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: |
          for i in 1 2 3; do
            npm run build -- --publish never && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::build falhou (tentativa $i/3) — nova tentativa em $((i * 20))s"
              sleep $((i * 20))
            fi
          done
          echo "::error::build falhou nas 3 tentativas"
          exit 1

      - name: Subir artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: hofheim-launcher-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # Publica tudo de uma vez só, depois que Windows e Linux terminaram. Se cada job criasse
  # a release em paralelo, os dois disputariam a mesma tag.
  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar artefatos dos dois builds
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Criar release e subir arquivos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            **Windows:** `HofheimLauncher-Setup-*.exe`
            **Linux:** `HofheimLauncher-*-x86_64.AppImage` (recomendado — tem atualização automática) ou `HofheimLauncher-*-amd64.deb`
          files: dist-release/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
