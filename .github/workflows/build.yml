name: Build

# Build de verificação manual (Windows + Linux). Não publica release — quem publica é o
# release.yml, disparado pela tag v*. Rodar os dois na tag criaria releases duplicadas.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifacts: release/*.exe
          - os: ubuntu-22.04
            name: linux
            artifacts: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Mesmo esquema do release.yml: cache dos dois downloads do binário do electron (postinstall
      # do npm e app-builder no empacotamento) + retry no npm ci e no build, porque nenhum dos
      # dois retenta sozinho e cada um baixa ~90 MB do GitHub.
      - name: Cache dos binários do Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-v2-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-v2-${{ matrix.os }}-

      - name: Install dependencies
        shell: bash
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::npm ci falhou (tentativa $i/3) — nova tentativa em $((i * 15))s"
              sleep $((i * 15))
            fi
          done
          echo "::error::npm ci falhou nas 3 tentativas"
          exit 1

      - name: Build app
        shell: bash
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: |
          for i in 1 2 3; do
            npm run build -- --publish never && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::build falhou (tentativa $i/3) — nova tentativa em $((i * 20))s"
              sleep $((i * 20))
            fi
          done
          echo "::error::build falhou nas 3 tentativas"
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hofheim-launcher-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
